<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#5B3AA6" />
    <title>Yak Academy — رحلتك تبدأ من هنا</title>

    <!-- Fonts: Gilroy + Tajawal (landing, dashboard) Cairo (login, register), Aref Ruqaa (welcome card signature) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.cdnfonts.com/css/gilroy-bold" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;500;600;700;800&family=Aref+Ruqaa:wght@700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons used by landing, login and register -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- Apply the saved theme before first paint (no light→dark flash). -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("yak-theme");
          // The old dashboard used "yak_theme"; carry it over once.
          if (!theme) {
            theme = localStorage.getItem("yak_theme");
            if (theme) localStorage.setItem("yak-theme", theme);
          }
          if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
